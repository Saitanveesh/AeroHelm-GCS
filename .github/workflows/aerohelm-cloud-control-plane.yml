name: AeroHelm Cloud Control Plane
on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloud-fleet-control-plane-r1
      - feat/cloud-analytics-offload-r1
    paths:
      - 'cloud/**'
      - '.github/workflows/aerohelm-cloud-control-plane.yml'
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/aerohelm-cloud-control-plane.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cloud/requirements.txt
            cloud/requirements-dev.txt
      - name: Install cloud test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q cloud/app cloud/tests cloud/migrations
      - name: Run cloud API and adversarial regression suite
        run: python -m pytest -q cloud/tests
      - name: Check no GCS/serial command imports
        run: |
          if grep -REn 'mavutil|mavlink_connection|command_long_send|param_set_send|Serial\(' cloud/app; then
            echo "Forbidden aircraft IO primitive in cloud authority path"; exit 1
          fi
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pinned cloud Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --strict -r cloud/requirements-dev.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build cloud-only container
        run: docker build -f cloud/Dockerfile -t aerohelm-cloud:ci .
      - name: Verify isolated cloud module imports
        run: docker run --rm --entrypoint python aerohelm-cloud:ci -c "import importlib.util; from cloud.app.main import create_app; from cloud.app.scheduler import run_forever; from cloud.app.compute_worker import run_forever as cloud_compute; assert importlib.util.find_spec('pytest') is None; print('cloud image imports OK, dev tests excluded')"
      - name: Validate example private Compose wiring
        run: |
          mkdir -p cloud/secrets
          printf 'CI_ONLY_NOT_PRODUCTION\\n' > cloud/secrets/db_password.txt
          printf 'postgresql+psycopg://aerohelm:CI_ONLY_NOT_PRODUCTION@database:5432/aerohelm\\n' > cloud/secrets/app_database_url.txt
          cp cloud/.env.example cloud/.env
          docker compose -f cloud/compose.yaml config --quiet
          rm -rf cloud/secrets cloud/.env
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aerohelm_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aerohelm_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      AEROHELM_DATABASE_URL: postgresql+psycopg://ci:ci_password@localhost:5432/aerohelm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud/requirements-dev.txt
      - name: Apply durable PostgreSQL migration
        run: python -m alembic -c cloud/alembic.ini upgrade head
      - name: Verify migratable schema and production settings
        run: |
          AEROHELM_CLOUD_MODE=production \
          AEROHELM_OIDC_ISSUER=https://issuer.example.invalid \
          AEROHELM_OIDC_JWKS_URL=https://issuer.example.invalid/jwks \
          AEROHELM_ALLOWED_HOSTS=testserver \
          python - <<'PY'
          from fastapi.testclient import TestClient
          from cloud.app.main import create_app
          with TestClient(create_app()) as client:
              assert client.get("/health/ready").json()["ready"] is True
              print("PostgreSQL schema and production startup readiness PASS")
          PY
      - name: Validate initial migration repeatability
        run: python -m alembic -c cloud/alembic.ini upgrade head
      - name: PostgreSQL concurrent vehicle authority regression
        run: python -m pytest -q cloud/tests/test_postgres_races.py cloud/tests/test_analytics_postgres.py
