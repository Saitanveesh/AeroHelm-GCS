name: Vihanga supervised flight-control safety contracts

on:
  pull_request:
    paths:
      - "services/vihanga_link/**"
      - "plugins/**"
      - "scripts/Test-AeroHelmWindowsPages.ps1"
      - "scripts/Start-VihangaEngineeringDataLink.ps1"
      - ".github/workflows/vihanga-control-authority.yml"
  push:
    branches: [master, "release/vihanga-integrated-bench-candidate-20261108", "feat/engineering-datalink-native-bind-20261109"]
    paths:
      - "services/vihanga_link/**"
      - "plugins/**"
      - "scripts/Test-AeroHelmWindowsPages.ps1"
      - "scripts/Start-VihangaEngineeringDataLink.ps1"
      - ".github/workflows/vihanga-control-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing private-link dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/vihanga_link/requirements-test.txt
      - name: Syntax compile (no serial ports or credentials)
        run: python -m compileall -q services/vihanga_link
      - name: Supervised command policy, independent auth and Pi encoder
        run: |
          python -m pytest -q \
            services/vihanga_link/test_control_policy.py \
            services/vihanga_link/test_control_api.py \
            services/vihanga_link/test_control_transport_probe.py \
            services/vihanga_link/test_fc_readiness.py \
            services/vihanga_link/test_typed_downlink.py \
            services/vihanga_link/test_pi_control_adapter.py \
            services/vihanga_link/test_mission_transaction.py \
            services/vihanga_link/test_parameter_transaction.py
      - name: Existing Pi and relay regression checks
        run: |
          python -m pytest -q \
            services/vihanga_link/test_link.py \
            services/vihanga_link/test_deploy_contracts.py
      - name: Record explicit safety scope
        run: |
          echo "PASS: OFFLINE PYTHON CONTRACTS ONLY"
          echo "NO PIXHAWK, RC RADIO, LIVE NETWORK, WINDOWS GUI OR FLIGHT COMMAND TESTED"

  windows-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and execute real native WSS-to-TCP MAVLink bridge unit tests
        shell: bash
        run: |
          dotnet run --project Tools/AeroHelmMavlinkBridgeTests/AeroHelmMavlinkBridgeTests.csproj --configuration Release
      - name: Verify source contracts and denied raw MAVLink command paths
        shell: pwsh
        run: |
          ./scripts/Test-AeroHelmWindowsPages.ps1
      - name: Parse Windows pilot shadow diagnostic (never execute against aircraft)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/Test-VihangaControlTransport.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PASS: Windows shadow probe syntax parsed; no network or aircraft operations performed"
      - name: Parse Windows ARM/DISARM requester without executing commands
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/Request-VihangaTypedArmDisarm.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PASS: Interactive requester syntax parsed; no live relay or aircraft contacted."
      - name: Parse integrated one-command Windows acceptance harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/Invoke-VihangaIntegratedAcceptance.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PASS: One-command offline/live-readonly test harness parsed."
      - name: Parse source-hashed engineering Windows viewer launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/Start-VihangaEngineeringDataLink.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PASS: Engineering launcher syntax parsed; no native app or aircraft operated."
