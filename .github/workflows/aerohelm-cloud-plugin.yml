      - "scripts/Test-VihangaPassiveBench.ps1"
      - "plugins/AeroHelmReadOnlyPages.cs"
      - "scripts/Build-Integrated-AeroHelm.ps1"
      - "scripts/Start-AeroHelm-Touch.ps1"
      - "scripts/Start-AeroHelm-Session.ps1"
      - "scripts/Repair-AeroHelmWindows.ps1"
      - "scripts/Install-AeroHelmCloud.ps1"
      - "scripts/Restore-AeroHelmPlugin.ps1"
      - "scripts/Test-AeroHelmPluginRoundtrip.ps1"
      - "scripts/Test-AeroHelmWindowsPages.ps1"
      - "scripts/Test-AeroHelmPrivatePreflight.ps1"
      - "plugins/AeroHelmWorkspace.cs"
      - "plugins/AeroHelmOperations.cs"
      - "plugins/AeroHelmPlatformV2.cs"
      - "scripts/Start-AeroHelm-NativeCloud.ps1"
      - "plugins/AeroHelmSurveyPlanner.cs"
      - "Tools/AeroHelmSurveyTests/**"
      - "Tools/AeroHelmMavlinkBridgeTests/**"
      - "Tools/test_aerohelm_offline_gcs.py"
      - "Tools/test_vihanga_native_toolbar.py"
      - "scripts/Test-VihangaPassiveBench.ps1"
      - "scripts/Run-AeroHelmOfflineChecks.ps1"
      - "scripts/Test-VihangaCertification.ps1"
      - "scripts/Update-AeroHelmLatest.ps1"
      - "Tools/fixtures/physics_lab_hover.json"
      - "scripts/Consolidate-AeroHelmWindows.ps1"
      - "scripts/Cleanup-AeroHelmGenerated.ps1"
      - "scripts/Audit-AeroHelmModules.ps1"
      - "scripts/Start-AeroHelm-NativeCloud.ps1"
      - "scripts/Inspect-AeroHelmWindowsStage.ps1"
      - "scripts/Test-AeroHelmPrivatePreflight.ps1"
      - "scripts/Test-VihangaCertification.ps1"
      - "docs/VIHANGA_CERTIFICATION.md"
      - "MainV2.cs"
      - "Plugins/AeroHelmCloud/**"
      - ".github/workflows/aerohelm-cloud-plugin.yml"
  pull_request:
    branches:
      - feat/gcs-touch-ux-readonly-fleet-r1
    paths:
      - "scripts/Install-AeroHelmCloud.ps1"
      - "scripts/Restore-AeroHelmPlugin.ps1"
      - "scripts/Test-AeroHelmPluginRoundtrip.ps1"
      - "plugins/AeroHelmCloud.cs"
      - "plugins/AeroHelmReceiveOnlyBridge.cs"
      - "plugins/AeroHelmLinkQuality.cs"
      - "plugins/AeroHelmPilotDirectWindow.cs"
      - "plugins/AeroHelmLinkSelector.cs"
      - "plugins/AeroHelmCloudAttitudeWindow.cs"
      - "scripts/Start-AeroHelm-DirectBackup.ps1"
      - "AeroHelmStartupGate.cs"
      - "plugins/AeroHelmTwinLabWindow.cs"
      - "plugins/AeroHelmFleetLabWindow.cs"
      - "plugins/AeroHelmReadOnlyPages.cs"
      - "plugins/VihangaSharedUi.cs"
      - "scripts/Start-VihangaGCS.ps1"
      - "plugins/AeroHelmOperations.cs"
      - "plugins/AeroHelmWorkspace.cs"
      - "scripts/Build-Integrated-AeroHelm.ps1"
      - "scripts/Start-AeroHelm-Touch.ps1"
      - "scripts/Start-AeroHelm-Session.ps1"
      - "scripts/Repair-AeroHelmWindows.ps1"
      - "scripts/Test-AeroHelmWindowsPages.ps1"
      - "scripts/Test-AeroHelmPrivatePreflight.ps1"
      - "plugins/AeroHelmPlatformV2.cs"
      - "Plugins/AeroHelmCloud/**"
      - "Tools/AeroHelmMavlinkBridgeTests/**"
      - "Tools/test_aerohelm_offline_gcs.py"
      - "Tools/test_vihanga_native_toolbar.py"
      - "scripts/Run-AeroHelmOfflineChecks.ps1"
      - "scripts/Update-AeroHelmLatest.ps1"
      - "Tools/fixtures/physics_lab_hover.json"
      - "scripts/Consolidate-AeroHelmWindows.ps1"
      - "scripts/Cleanup-AeroHelmGenerated.ps1"
      - "scripts/Audit-AeroHelmModules.ps1"
      - "scripts/Start-AeroHelm-NativeCloud.ps1"
      - "MainV2.cs"
      - ".github/workflows/aerohelm-cloud-plugin.yml"
  workflow_dispatch:

jobs:
  windows-page-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Windows page source contracts (no aircraft)
        shell: pwsh
        run: ./scripts/Test-AeroHelmWindowsPages.ps1
      - name: Audit native GCS workspaces without aircraft
        shell: pwsh
        run: ./scripts/Audit-AeroHelmModules.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portable offline GCS safety, icons and TCP policy tests
        run: python -m unittest -v Tools.test_aerohelm_offline_gcs Tools.test_aerohelm_build_globs Tools.test_vihanga_native_toolbar

  plugin-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Plugins/AeroHelmCloud/AeroHelmCloud.Plugin.csproj --verbosity quiet
      - name: Compile plugin against Mission Planner
        run: dotnet build Plugins/AeroHelmCloud/AeroHelmCloud.Plugin.csproj --configuration Release --no-restore --verbosity minimal

  windows-solution-validation:
    # Run exact-head full native builds on every reviewed feature push as well
    # as PRs. Plugin-only CI cannot establish the native Windows integration.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify offline AeroHelm Windows source contracts
        shell: powershell
        run: |
          & .\scripts\Test-AeroHelmWindowsPages.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build full Mission Planner solution with Visual Studio MSBuild
        shell: powershell
        run: |
          & .\scripts\Build-AeroHelmGCS.ps1 -Target Solution
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compile the integrated AeroHelm plugin against native GCS
        shell: powershell
        run: |
          & .\scripts\Build-AeroHelmGCS.ps1 -Target Plugin
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Record exact compiled native evidence (not flight clearance)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'bin/Release/net461/MissionPlanner.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Full native executable missing after solution build.'
          }
          $candidates = @(Get-ChildItem 'Plugins/AeroHelmCloud/bin' -Recurse -File -Filter 'AeroHelm.Cloud.Plugin.Validation.dll' |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          if ($candidates.Count -ne 1) {
            throw "Expected one Release plugin output, found $($candidates.Count)."
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[a-f0-9]{40}$') {
            throw 'Cannot fingerprint exact CI source commit.'
          }
          New-Item -ItemType Directory -Path 'build-logs' -Force | Out-Null
          [ordered]@{
            schema='vihanga.ci.native-build.v1'
            source_commit=$head
            workflow='AeroHelm Cloud Plugin Validation'
            native_executable_sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            compiled_plugin_sha256=(Get-FileHash -LiteralPath $candidates[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            windows_ui_smoke_verified=$false
            physical_flight_authorized=$false
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath 'build-logs/vihanga-ci-native-evidence.json' -Encoding UTF8
      - name: Disposable compiled-plugin installation and rollback roundtrip
        shell: powershell
        env:
          AEROHELM_DISPOSABLE_CI: "1"
        run: |
          & .\scripts\Test-AeroHelmPluginRoundtrip.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Archive native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: vihanga-native-evidence-${{ github.sha }}
          path: build-logs/vihanga-ci-native-evidence.json
          if-no-files-found: error

  mavlink-native-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Native receive-only bridge CRC, freshness and outage regression
        run: dotnet run --project Tools/AeroHelmMavlinkBridgeTests/AeroHelmMavlinkBridgeTests.csproj --configuration Release

  survey-draft-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Offline mission generator regression tests
        run: dotnet run --project Tools/AeroHelmSurveyTests/AeroHelmSurveyTests.csproj --configuration Release
