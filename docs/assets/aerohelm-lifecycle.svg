<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="260" viewBox="0 0 1320 260" role="img" aria-labelledby="title desc"><title id="title">AeroHelm virtual mission lifecycle</title><desc id="desc">Eight plain numbered engineering workflow blocks from enroll to recover. Virtual dispatch and separate approval do not create physical-aircraft command authority.</desc><rect width="1320" height="260" fill="#f7f8f6"/><text x="42" y="46" fill="#172b34" font-size="23" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">VIRTUAL FLEET WORKFLOW</text><text x="42" y="70" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Approval, leases and audit are coordination controls. They do not substitute for aircraft safety qualification.</text><line x1="42" y1="87" x2="1278" y2="87" stroke="#b9c5c7" stroke-width="1" /><rect x="41" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="53" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">01</text><text x="53" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ENROLL</text><text x="53" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Scoped identity</text><line x1="188" y1="158" x2="198" y2="158" stroke="#176b73" stroke-width="2" /><path d="M190 153 L198 158 L190 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="201" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="213" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">02</text><text x="213" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">OBSERVE</text><text x="213" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fresh telemetry</text><line x1="348" y1="158" x2="358" y2="158" stroke="#176b73" stroke-width="2" /><path d="M350 153 L358 158 L350 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="361" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="373" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">03</text><text x="373" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">PLAN</text><text x="373" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Mission record</text><line x1="508" y1="158" x2="518" y2="158" stroke="#176b73" stroke-width="2" /><path d="M510 153 L518 158 L510 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="521" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="533" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">04</text><text x="533" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">APPROVE</text><text x="533" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Separate actor</text><line x1="668" y1="158" x2="678" y2="158" stroke="#176b73" stroke-width="2" /><path d="M670 153 L678 158 L670 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="681" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="693" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">05</text><text x="693" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LEASE</text><text x="693" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Exclusive epoch</text><line x1="828" y1="158" x2="838" y2="158" stroke="#176b73" stroke-width="2" /><path d="M830 153 L838 158 L830 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="841" y="115" width="146" height="88" fill="#fdf9f5" stroke="#a86a36" stroke-width="1.8"/><text x="853" y="139" fill="#a86a36" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">06</text><text x="853" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SIMULATE</text><text x="853" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Virtual only</text><line x1="988" y1="158" x2="998" y2="158" stroke="#176b73" stroke-width="2" /><path d="M990 153 L998 158 L990 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="1001" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="1013" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">07</text><text x="1013" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">VERIFY</text><text x="1013" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ACK / timeout</text><line x1="1148" y1="158" x2="1158" y2="158" stroke="#176b73" stroke-width="2" /><path d="M1150 153 L1158 158 L1150 163" fill="none" stroke="#176b73" stroke-width="2"/><rect x="1161" y="115" width="146" height="88" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><text x="1173" y="139" fill="#176b73" font-size="14" font-weight="700" text-anchor="start" font-family="monospace">08</text><text x="1173" y="164" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">RECOVER</text><text x="1173" y="185" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Audit / expiry</text><line x1="41" y1="225" x2="1279" y2="225" stroke="#b9c5c7" stroke-width="1" /><text x="42" y="245" fill="#a86a36" font-size="12" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NO ARMING · NO REAL MISSION UPLOAD · NO PHYSICAL CLOUD COMMAND DISPATCH IN R1</text></svg>