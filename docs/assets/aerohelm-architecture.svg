<path d="M180 374v47h968v-47" stroke="#e5ae78" stroke-dasharray="8 7" stroke-width="2.5" fill="none"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="666" y="445" fill="#f0be8d" text-anchor="middle" font-size="14">PILOT-DIRECT BACKUP: separate physical radio / USB; not a cloud command channel</text></g></svg>