<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="455" viewBox="0 0 1320 455" role="img" aria-labelledby="title desc"><title id="title">AeroHelm distributed responsibility diagram</title><desc id="desc">Plain engineering block diagram. Flight controller to companion edge to cloud fleet orchestration to operator display. Independent physical pilot backup is a separate path. No direct cloud flight commands in R1.</desc><rect width="1320" height="455" fill="#f7f8f6"/><text x="43" y="48" fill="#172b34" font-size="24" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SYSTEM BOUNDARIES</text><text x="43" y="73" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Reference architecture across development branches; cloud R1 does not dispatch physical flight commands.</text><line x1="43" y1="90" x2="1277" y2="90" stroke="#b9c5c7" stroke-width="1" /><rect x="43" y="123" width="255" height="196" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><rect x="43" y="123" width="5" height="196" fill="#176b73"/><text x="63" y="151" fill="#176b73" font-size="12" font-weight="700" text-anchor="start" font-family="monospace">01 / AIRCRAFT</text><text x="63" y="180" fill="#172b34" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Flight controller</text><text x="63" y="213" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Onboard stabilization</text><text x="63" y="238" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Failsafes / local authority</text><text x="63" y="263" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Actual telemetry source</text><rect x="351" y="123" width="255" height="196" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><rect x="351" y="123" width="5" height="196" fill="#176b73"/><text x="371" y="151" fill="#176b73" font-size="12" font-weight="700" text-anchor="start" font-family="monospace">02 / EDGE</text><text x="371" y="180" fill="#172b34" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Companion link</text><text x="371" y="213" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Single UART owner</text><text x="371" y="238" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fresh observations</text><text x="371" y="263" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Private uplink</text><rect x="659" y="123" width="280" height="196" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><rect x="659" y="123" width="5" height="196" fill="#176b73"/><text x="679" y="151" fill="#176b73" font-size="12" font-weight="700" text-anchor="start" font-family="monospace">03 / CLOUD</text><text x="679" y="180" fill="#172b34" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fleet coordination</text><text x="679" y="213" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Identity / leases / missions</text><text x="679" y="238" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Virtual dispatch and audit</text><text x="679" y="263" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Analytics research</text><rect x="992" y="123" width="285" height="196" fill="#ffffff" stroke="#b9c5c7" stroke-width="1"/><rect x="992" y="123" width="5" height="196" fill="#176b73"/><text x="1012" y="151" fill="#176b73" font-size="12" font-weight="700" text-anchor="start" font-family="monospace">04 / OPERATOR</text><text x="1012" y="180" fill="#172b34" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Lightweight GCS</text><text x="1012" y="213" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fleet and link status</text><text x="1012" y="238" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Read-only cloud observation</text><text x="1012" y="263" fill="#586a72" font-size="14" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Pilot selects local path</text><line x1="299" y1="210" x2="347" y2="210" stroke="#176b73" stroke-width="2" /><path d="M339 205 L347 210 L339 215" fill="none" stroke="#176b73" stroke-width="2"/><line x1="607" y1="210" x2="655" y2="210" stroke="#176b73" stroke-width="2" /><path d="M647 205 L655 210 L647 215" fill="none" stroke="#176b73" stroke-width="2"/><line x1="940" y1="210" x2="988" y2="210" stroke="#176b73" stroke-width="2" /><path d="M980 205 L988 210 L980 215" fill="none" stroke="#176b73" stroke-width="2"/><text x="324" y="196" fill="#586a72" font-size="10" font-weight="600" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">OBS</text><text x="632" y="196" fill="#586a72" font-size="10" font-weight="600" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">TLS</text><text x="964" y="196" fill="#586a72" font-size="10" font-weight="600" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">VIEW</text><line x1="176" y1="319" x2="176" y2="394" stroke="#a86a36" stroke-width="2" stroke-dasharray="6 5"/><line x1="176" y1="394" x2="991" y2="394" stroke="#a86a36" stroke-width="2" stroke-dasharray="6 5"/><path d="M981 389L991 394L981 399" fill="none" stroke="#a86a36" stroke-width="2"/><rect x="998" y="358" width="272" height="74" fill="#ffffff" stroke="#a86a36" stroke-width="1.6"/><text x="1012" y="380" fill="#a86a36" font-size="14" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">PILOT-DIRECT BACKUP</text><text x="1012" y="401" fill="#586a72" font-size="13" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Separate USB / telemetry radio</text><text x="1012" y="418" fill="#586a72" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">No automatic link takeover</text><text x="43" y="443" fill="#586a72" font-size="13" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Solid links: observation/control-plane status  ·  Dashed link: separately wired local pilot connection</text></svg>