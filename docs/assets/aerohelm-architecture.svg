<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="480" viewBox="0 0 1320 480" role="img" aria-labelledby="title desc">
<title id="title">AeroHelm conceptual multi-UAV architecture and pilot fallback</title><desc id="desc">Aircraft and companion computer observe telemetry through private uplink to cloud orchestration, lightweight operator view, and a separate, deliberate, physical direct pilot telemetry path. No physical cloud dispatch in R1.</desc>
<rect width="1320" height="480" rx="14" fill="#0c1c27"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="38" y="47" font-size="22" fill="#f0f7f8" font-weight="700">SEPARATE COORDINATION FROM FLIGHT AUTHORITY</text><text x="38" y="73" fill="#94b6c6" font-size="14">Conceptual architecture across unmerged development branches — virtual dispatch only in cloud R1.</text></g>
<g stroke-width="2"><rect x="35" y="107" width="292" height="262" rx="13" fill="#15303f" stroke="#457d93"/><rect x="365" y="107" width="300" height="262" rx="13" fill="#133641" stroke="#55b7aa"/><rect x="706" y="107" width="284" height="262" rx="13" fill="#163440" stroke="#67a1b6"/><rect x="1032" y="107" width="254" height="262" rx="13" fill="#172e3c" stroke="#4b8598"/></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="54" y="144" font-size="19" font-weight="700" fill="#fff">AIRCRAFT / EDGE</text><text x="384" y="144" font-size="19" font-weight="700" fill="#fff">PRIVATE UPLINK</text><text x="726" y="144" font-size="19" font-weight="700" fill="#fff">CLOUD FLEET</text><text x="1052" y="144" font-size="19" font-weight="700" fill="#fff">OPERATOR</text>
<g font-size="14" fill="#c4dce4"><text x="54" y="194">Flight controller / failsafes</text><text x="54" y="226">Companion: one UART owner</text><text x="54" y="258">Normalized observation</text><text x="54" y="290">Independent local pilot</text>
<text x="384" y="194">Authenticated private link</text><text x="384" y="226">Freshness and source ID</text><text x="384" y="258">Reject stale replay</text><text x="384" y="290">Fail closed on link loss</text>
<text x="726" y="194">Tenant / identity / OIDC</text><text x="726" y="226">Fleet registry and leases</text><text x="726" y="258">Virtual mission workflow</text><text x="726" y="290">Audit + data offload R&amp;D</text>
<text x="1052" y="194">Lightweight GCS view</text><text x="1052" y="226">Touch / status research</text><text x="1052" y="258">Select link deliberately</text><text x="1052" y="290">No automatic takeover</text></g></g>
