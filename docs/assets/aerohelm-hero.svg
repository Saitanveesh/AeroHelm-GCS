<title id="title">AeroHelm — Cloud-first multi-UAV fleet coordination</title>
<desc id="desc">Original editable technical illustration of distributed UAV nodes connecting to a private cloud fleet control plane and a separate local pilot path, not actual telemetry or a certified flight system.</desc>
