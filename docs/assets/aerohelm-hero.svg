<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="302" viewBox="0 0 1280 302" role="img" aria-labelledby="title desc"><title id="title">AeroHelm engineering title plate</title><desc id="desc">Minimal editorial technical title plate: AeroHelm cloud-fleet engineering project, primary responsibilities and flight-safety scope. No AI-generated art, simulated dashboard or performance metrics.</desc><rect width="1280" height="302" fill="#f7f8f6"/><rect width="1280" height="7" fill="#176b73"/><text x="63" y="55" fill="#176b73" font-size="13" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif" letter-spacing="1">A E R O H E L M   /   SYSTEM NOTE 01</text><line x1="63" y1="74" x2="743" y2="74" stroke="#b9c5c7" stroke-width="1" /><text x="58" y="164" fill="#172b34" font-size="76" font-weight="800" text-anchor="start" font-family="Arial,Helvetica,sans-serif">AEROHELM</text><text x="63" y="207" fill="#586a72" font-size="19" font-weight="600" text-anchor="start" font-family="Arial,Helvetica,sans-serif">CLOUD-FIRST MULTI-UAV COORDINATION</text><text x="63" y="245" fill="#172b34" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fleet state · Private telemetry · Explicit pilot backup</text><line x1="785" y1="35" x2="785" y2="261" stroke="#b9c5c7" stroke-width="1" /><text x="816" y="55" fill="#176b73" font-size="13" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ARCHITECTURE / SCOPE</text><line x1="817" y1="81" x2="1211" y2="81" stroke="#b9c5c7" stroke-width="1" /><text x="817" y="101" fill="#176b73" font-size="16" font-weight="700" text-anchor="start" font-family="monospace">01</text><text x="855" y="98" fill="#172b34" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">CLOUD ORCHESTRATION</text><text x="855" y="119" fill="#586a72" font-size="13" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Miss